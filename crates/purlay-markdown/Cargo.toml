[package]
name = "purlay-markdown"
description = "Purlay's message markdown reader: the narrowed tree the server's readMarkdown gives"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
markdown = "1.0.0"
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The corpus nests deeper than serde_json's default recursion limit.
serde_json = { workspace = true, features = ["unbounded_depth"] }

[lints]
workspace = true
